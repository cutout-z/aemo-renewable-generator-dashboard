name: Monthly Curtailment Update

on:
  # Scheduled production updates run on the NAS runner (nas-job; see deploy/README.md).
  # Keep this workflow as a manual verification/fallback runner.
  workflow_dispatch:
    inputs:
      full_refresh:
        # Default true: the NAS lane (deploy/run-update.sh) always runs --full-refresh, and a
        # cached run would republish feather caches the daily lane has since replaced.
        description: 'Re-fetch all data (ignore feather caches), as the NAS lane does'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Curtailment Dashboard
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            ARGS="--full-refresh"
          fi
          python -m src.main $ARGS

      - name: Validate outputs
        run: python tests/validate_outputs.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/ data/*.feather
          git diff --staged --quiet || git commit -m "Update curtailment data"
          git push

      # Last, after the push: red while a newer ELI edition is confirmed but not wired in
      - name: Post-publish check
        run: python -m src.post_publish_check
